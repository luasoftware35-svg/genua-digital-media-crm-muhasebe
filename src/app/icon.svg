<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Genua">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C1C1C"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBFF2B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#DBFF2B" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#shine)"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" stroke="#DBFF2B" stroke-opacity="0.25" stroke-width="1.25"/>
  <rect x="0" y="16" width="4" height="32" rx="2" fill="#DBFF2B"/>
  <text
    x="36"
    y="44"
    text-anchor="middle"
    font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
    font-size="30"
    font-weight="900"
    fill="#DBFF2B"
    filter="url(#glow)"
  >G</text>
</svg>
